spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET must be set in production}
  frontend-url: ${FRONTEND_URL:?FRONTEND_URL must be set in production}

logging:
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    com.orthoflow: INFO

orthoflow:
  # See AuthController#register / application.yml. Still defaults to false
  # here too — self-service account creation stays open until the real
  # practice is onboarded, at which point set RESTRICT_REGISTRATION_TO_BOOTSTRAP=true
  # on this deployment.
  auth:
    restrict-registration-to-bootstrap: ${RESTRICT_REGISTRATION_TO_BOOTSTRAP:false}
  # No default in production: a deployment that forgets this fails to start
  # rather than silently serving a frontend it does not trust.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set in production}
  voice:
    audit:
      # Audit XII.5: do not retain raw speech transcripts alongside patient
      # identifiers in production. The interpreted command, its confidence and
      # what it changed are still recorded in full — only the utterance is
      # dropped. Override deliberately (and document why) if a supervised
      # pilot needs transcripts to measure recognition accuracy.
      store-transcript: ${VOICE_STORE_TRANSCRIPT:false}
